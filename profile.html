<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="CASEmeのユーザープロフィール画面です。"
  >

  <title>プロフィール | CASEme</title>

  <meta name="theme-color" content="#6c8875">
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="caseme-icons/favicon-32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="caseme-icons/apple-touch-icon.png">
  <link rel="manifest" href="site.webmanifest">

  <link rel="stylesheet" href="style.css?v=8">
</head>

<body class="profile-page">
  <header class="profile-header">
    <div class="profile-header-inner">
      <a
        href="index.html"
        class="logo"
        aria-label="CASEme ホーム"
      >
        <img class="logo-wordmark" src="caseme-icons/caseme-logo-c.svg?v=3" alt="" aria-hidden="true">
      </a>

      <nav
        class="profile-navigation"
        aria-label="メインメニュー"
      >
        <a href="index.html">ホーム</a>
        <a href="search.html">検索</a>
        <a href="post.html">投稿する</a>
        <a href="favorites.html">お気に入り</a>

        <button
          type="button"
          id="profile-logout-button"
          class="profile-logout-button"
        >
          ログアウト
        </button>
      </nav>
    </div>
  </header>

  <main class="profile-main">
    <section
      class="profile-card"
      aria-labelledby="profile-heading"
    >
      <div class="profile-card-heading">
       <button
        type="button"
        id="profile-avatar-preview"
        class="profile-avatar-preview"
        aria-label="プロフィール画像を変更"
        title="プロフィール画像を変更"
      >
        C
      </button>

        <div>
          <p class="profile-eyebrow">
            MY PROFILE
          </p>

          <h1 id="profile-heading">
            プロフィール
          </h1>

          <p class="profile-heading-description">
            CASEmeで表示される名前や自己紹介を設定できます。
          </p>
        </div>
      </div>

      <form id="profile-form" class="profile-form">

        <!-- プロフィール画像 -->
        <div class="profile-form-field">
          <label for="profile-avatar-input">
            プロフィール画像
          </label>

          <input
            type="file"
            id="profile-avatar-input"
            hidden
            name="avatar"
            accept="image/jpeg,image/png,image/webp"
          >

          <p class="profile-field-note">
            JPEG・PNG・WebP形式の画像を選択できます。
            本人が使用する権利を持つ画像を設定してください。
          </p>
        </div>
        <div class="profile-form-field">
          <label for="profile-display-name">
            表示名
            <span class="required-label">必須</span>
          </label>

          <input
            type="text"
            id="profile-display-name"
            name="displayName"
            maxlength="40"
            autocomplete="name"
            required
          >

          <p class="profile-field-note">
            投稿やプロフィールに表示される名前です。
          </p>
        </div>

        <div class="profile-form-field">
          <label for="profile-username">
            ユーザー名
          </label>

          <div class="profile-username-input">
            <span aria-hidden="true">@</span>

            <input
              type="text"
              id="profile-username"
              name="username"
              maxlength="20"
              autocomplete="username"
              placeholder="caseme_user"
            >
          </div>

          <p class="profile-field-note">
            半角英数字と_を使い、3〜20文字で入力します。
          </p>
        </div>

        <div class="profile-form-field">
          <div class="profile-label-row">
            <label for="profile-bio">
              自己紹介
            </label>

            <span id="profile-bio-count">
              0 / 160
            </span>
          </div>

          <textarea
            id="profile-bio"
            name="bio"
            rows="5"
            maxlength="160"
            placeholder="好きなケースの系統や、カスタマイズについて書いてみましょう。"
          ></textarea>
        </div>

        <div class="profile-form-actions">
          <a
            href="index.html"
            class="profile-cancel-link"
          >
            ホームへ戻る
          </a>

          <button
            type="submit"
            id="profile-save-button"
            class="profile-save-button"
          >
            変更を保存
          </button>
        </div>

        <p
          id="profile-status"
          class="profile-status"
          role="status"
          aria-live="polite"
        ></p>
      </form>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script src="supabase-profiles.js"></script>
  <script src="profile.js"></script>

  <!-- スマホ用固定下部ナビゲーション -->
  <nav class="bottom-nav" aria-label="モバイルナビゲーション">
    <a href="index.html" id="bottom-nav-home" class="bottom-nav-item">
      <svg class="bottom-nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
        <polyline points="9 22 9 12 15 12 15 22"></polyline>
      </svg>
      <span class="bottom-nav-label">ホーム</span>
    </a>
    <a href="search.html" id="bottom-nav-search" class="bottom-nav-item">
      <svg class="bottom-nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="8"></circle>
        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
      </svg>
      <span class="bottom-nav-label">検索</span>
    </a>
    <a href="post.html" id="bottom-nav-post" class="bottom-nav-item bottom-nav-center">
      <div class="bottom-nav-center-btn" aria-label="投稿する">
        <svg class="bottom-nav-center-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="12" y1="5" x2="12" y2="19"></line>
          <line x1="5" y1="12" x2="19" y2="12"></line>
        </svg>
      </div>
      <span class="bottom-nav-label">投稿する</span>
    </a>
    <a href="favorites.html" id="bottom-nav-favorites" class="bottom-nav-item">
      <svg class="bottom-nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path>
      </svg>
      <span class="bottom-nav-label">お気に入り</span>
    </a>
    <a href="auth.html" id="bottom-nav-profile" class="bottom-nav-item">
      <svg class="bottom-nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
        <circle cx="12" cy="7" r="4"></circle>
      </svg>
      <span class="bottom-nav-label">プロフィール</span>
    </a>
  </nav>

  <script src="bottom-nav.js"></script>
</body>
</html>
