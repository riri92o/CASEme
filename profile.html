<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="CASEmeのユーザープロフィール画面です。"
  >

  <title>プロフィール | CASEme</title>

  <link rel="stylesheet" href="style.css?v=3">
</head>

<body class="profile-page">
  <header class="profile-header">
    <div class="profile-header-inner">
      <a
        href="index.html"
        class="logo"
        aria-label="CASEme ホーム"
      >
        CASE<span>me</span>
      </a>

      <nav
        class="profile-navigation"
        aria-label="メインメニュー"
      >
        <a href="index.html">ホーム</a>
        <a href="post.html">投稿する</a>
        <a href="favorites.html">お気に入り</a>

        <button
          type="button"
          id="profile-logout-button"
          class="profile-logout-button"
        >
          ログアウト
        </button>
      </nav>
    </div>
  </header>

  <main class="profile-main">
    <section
      class="profile-card"
      aria-labelledby="profile-heading"
    >
      <div class="profile-card-heading">
       <button
        type="button"
        id="profile-avatar-preview"
        class="profile-avatar-preview"
        aria-label="プロフィール画像を変更"
        title="プロフィール画像を変更"
      >
        C
      </button>

        <div>
          <p class="profile-eyebrow">
            MY PROFILE
          </p>

          <h1 id="profile-heading">
            プロフィール
          </h1>

          <p class="profile-heading-description">
            CASEmeで表示される名前や自己紹介を設定できます。
          </p>
        </div>
      </div>

      <form id="profile-form" class="profile-form">

        <!-- プロフィール画像 -->
        <div class="profile-form-field">
          <label for="profile-avatar-input">
            プロフィール画像
          </label>

          <input
            type="file"
            id="profile-avatar-input"
            hidden
            name="avatar"
            accept="image/jpeg,image/png,image/webp"
          >

          <p class="profile-field-note">
            JPEG・PNG・WebP形式の画像を選択できます。
            本人が使用する権利を持つ画像を設定してください。
          </p>
        </div>
        <div class="profile-form-field">
          <label for="profile-display-name">
            表示名
            <span class="required-label">必須</span>
          </label>

          <input
            type="text"
            id="profile-display-name"
            name="displayName"
            maxlength="40"
            autocomplete="name"
            required
          >

          <p class="profile-field-note">
            投稿やプロフィールに表示される名前です。
          </p>
        </div>

        <div class="profile-form-field">
          <label for="profile-username">
            ユーザー名
          </label>

          <div class="profile-username-input">
            <span aria-hidden="true">@</span>

            <input
              type="text"
              id="profile-username"
              name="username"
              maxlength="20"
              autocomplete="username"
              placeholder="caseme_user"
            >
          </div>

          <p class="profile-field-note">
            半角英数字と_を使い、3〜20文字で入力します。
          </p>
        </div>

        <div class="profile-form-field">
          <div class="profile-label-row">
            <label for="profile-bio">
              自己紹介
            </label>

            <span id="profile-bio-count">
              0 / 160
            </span>
          </div>

          <textarea
            id="profile-bio"
            name="bio"
            rows="5"
            maxlength="160"
            placeholder="好きなケースの系統や、カスタマイズについて書いてみましょう。"
          ></textarea>
        </div>

        <div class="profile-form-actions">
          <a
            href="index.html"
            class="profile-cancel-link"
          >
            ホームへ戻る
          </a>

          <button
            type="submit"
            id="profile-save-button"
            class="profile-save-button"
          >
            変更を保存
          </button>
        </div>

        <p
          id="profile-status"
          class="profile-status"
          role="status"
          aria-live="polite"
        ></p>
      </form>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script src="supabase-profiles.js"></script>
  <script src="profile.js"></script>
  
</body>
</html>
