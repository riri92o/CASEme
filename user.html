<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="CASEmeユーザーの公開プロフィールです。"
  >

  <title>ユーザープロフィール | CASEme</title>

  <meta name="theme-color" content="#6c8875">
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="caseme-icons/favicon-32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="caseme-icons/apple-touch-icon.png">
  <link rel="manifest" href="site.webmanifest">

  <link rel="stylesheet" href="style.css?v=6">
</head>

<body class="user-page">
  <header class="profile-header">
    <div class="profile-header-inner">
    <a
        href="index.html"
        class="logo"
        aria-label="CASEme ホーム"
    >
    CASE<span>me</span>
    </a>

      <nav
        class="profile-navigation"
        aria-label="メインメニュー"
      >
        <a href="index.html">ホーム</a>
        <a href="search.html">検索</a>
        <a href="post.html">投稿する</a>
        <a href="favorites.html">お気に入り</a>
      </nav>
    </div>
  </header>

  <main class="user-main">
    <section
      id="user-profile-card"
      class="user-profile-card"
      aria-labelledby="user-display-name"
    >
      <div
        id="user-avatar"
        class="user-avatar"
        aria-hidden="true"
      >
        C
      </div>

      <div class="user-profile-content">
        <p class="profile-eyebrow">
          CASEme PROFILE
        </p>

        <h1 id="user-display-name">
          プロフィールを読み込んでいます…
        </h1>

        <p
          id="user-username"
          class="user-username"
        ></p>

        <p
          id="user-bio"
          class="user-bio"
        ></p>

        <div class="user-follow-area">
          <div
            class="user-follow-stats"
            aria-label="フォロー情報"
          >
            <button
              type="button"
              id="user-following-list-button"
              class="user-follow-stat"
            >
              <strong id="user-following-count">0</strong>
              <span>フォロー中</span>
            </button>

            <button
              type="button"
              id="user-follower-list-button"
              class="user-follow-stat"
            >
              <strong id="user-follower-count">0</strong>
              <span>フォロワー</span>
            </button>
          </div>

          <button
            type="button"
            id="user-follow-button"
            class="user-follow-button"
            hidden
          >
            フォローする
          </button>
        </div>

      </div>
    </section>

    <section
      class="user-posts-section"
      aria-labelledby="user-posts-heading"
    >
      <div class="user-posts-heading">
        <div>
          <p class="profile-eyebrow">
            CASE COLLECTION
          </p>

          <h2 id="user-posts-heading">
            このユーザーの投稿
          </h2>
        </div>

        <p id="user-post-count">
          0件
        </p>
      </div>

      <div
        id="user-post-grid"
        class="user-post-grid"
      ></div>

      <p
        id="user-page-status"
        class="user-page-status"
        role="status"
        aria-live="polite"
      ></p>
    </section>
  </main>

  <!-- 投稿詳細画面 -->
  <dialog id="post-detail-dialog" class="post-detail-dialog">
    <div class="detail-dialog-inner">
      <button
        type="button"
        id="detail-close-button"
        class="detail-close-button"
        aria-label="投稿詳細を閉じる"
      >
        ×
      </button>

      <div class="detail-layout">
        <!-- 詳細画像 -->
        <div class="detail-image-area">
          <img
            id="detail-image"
            class="detail-image"
            src=""
            alt=""
          >
        </div>

        <!-- 詳細情報 -->
        <div class="detail-content">
          <div id="detail-tags" class="detail-tags"></div>
          
          <h2 id="detail-title"></h2>

          <!-- 投稿者プロフィール -->
          <a
            id="detail-author"
            class="detail-author"
            href="user.html"
            aria-label="投稿者のプロフィールを見る"
            hidden
          >
            <div
              id="detail-author-avatar"
              class="detail-author-avatar"
              aria-hidden="true"
            >
              C
            </div>

            <div class="detail-author-text">
              <p
                id="detail-author-name"
                class="detail-author-name"
              ></p>

              <p
                id="detail-author-username"
                class="detail-author-username"
              ></p>
            </div>
          </a>

          <p id="detail-device" class="detail-device"></p>

          <section class="detail-section">
            <h3>ケースの説明</h3>
            <p id="detail-description"></p>
          </section>

          <section
            id="detail-items-section"
            class="detail-section"
          >
            <h3>使用アイテム</h3>

            <dl class="detail-item-list">
              <div id="detail-case-row">
                <dt>ケース</dt>
                <dd id="detail-case"></dd>
              </div>

              <div id="detail-case-shop-row">
                <dt>ケースの購入場所</dt>
                <dd id="detail-case-shop"></dd>
              </div>

              <div id="detail-sticker-row">
                <dt>ステッカー</dt>
                <dd id="detail-sticker"></dd>
              </div>

              <div id="detail-sticker-shop-row">
                <dt>ステッカーの購入場所</dt>
                <dd id="detail-sticker-shop"></dd>
              </div>

              <div id="detail-keychain-row">
                <dt>キーホルダー</dt>
                <dd id="detail-keychain"></dd>
              </div>

              <div id="detail-keychain-shop-row">
                <dt>キーホルダーの購入場所</dt>
                <dd id="detail-keychain-shop"></dd>
              </div>

              <div id="detail-other-row">
                <dt>その他・備考</dt>
                <dd id="detail-other"></dd>
              </div>
            </dl>
          </section>

          <!-- 自分の投稿を管理するボタン -->
          <div class="detail-actions">
            <button
              type="button"
              id="edit-post-button"
              class="edit-post-button"
              hidden
            >
              投稿を編集
            </button>

            <button
              type="button"
              id="delete-post-button"
              class="delete-post-button"
              hidden
            >
              この投稿を削除
            </button>
          </div>
        </div>
      </div>
    </div>
  </dialog>

  <dialog
    id="follow-list-dialog"
    class="follow-list-dialog"
    aria-labelledby="follow-list-title"
  >
    <div class="follow-list-header">
      <h2 id="follow-list-title">フォロー中</h2>

      <button
        type="button"
        id="follow-list-close-button"
        class="follow-list-close-button"
        aria-label="一覧を閉じる"
      >
        ×
      </button>
    </div>

    <div
      id="follow-list"
      class="follow-list"
    ></div>

    <p
      id="follow-list-status"
      class="follow-list-status"
      role="status"
      aria-live="polite"
    ></p>
  </dialog>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script src="supabase-posts.js"></script>
  <script src="supabase-profiles.js"></script>
  <script src="supabase-follows.js"></script>
  <!-- 通知機能の処理 -->
  <script src="supabase-notifications.js"></script>
  <script src="multi-image-ui.js"></script>
  <script src="user-profile.js"></script>

  <!-- スマホ用固定下部ナビゲーション -->
  <nav class="bottom-nav" aria-label="モバイルナビゲーション">
    <a href="index.html" id="bottom-nav-home" class="bottom-nav-item">
      <svg class="bottom-nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
        <polyline points="9 22 9 12 15 12 15 22"></polyline>
      </svg>
      <span class="bottom-nav-label">ホーム</span>
    </a>
    <a href="search.html" id="bottom-nav-search" class="bottom-nav-item">
      <svg class="bottom-nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="8"></circle>
        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
      </svg>
      <span class="bottom-nav-label">検索</span>
    </a>
    <a href="post.html" id="bottom-nav-post" class="bottom-nav-item bottom-nav-center">
      <div class="bottom-nav-center-btn" aria-label="投稿する">
        <svg class="bottom-nav-center-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="12" y1="5" x2="12" y2="19"></line>
          <line x1="5" y1="12" x2="19" y2="12"></line>
        </svg>
      </div>
      <span class="bottom-nav-label">投稿する</span>
    </a>
    <a href="favorites.html" id="bottom-nav-favorites" class="bottom-nav-item">
      <svg class="bottom-nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path>
      </svg>
      <span class="bottom-nav-label">お気に入り</span>
    </a>
    <a href="auth.html" id="bottom-nav-profile" class="bottom-nav-item">
      <svg class="bottom-nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
        <circle cx="12" cy="7" r="4"></circle>
      </svg>
      <span class="bottom-nav-label">プロフィール</span>
    </a>
  </nav>

  <script src="bottom-nav.js"></script>
</body>
</html>
