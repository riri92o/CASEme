<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="CASEmeへのログイン・新規登録ページです。"
  >

  <title>ログイン・新規登録 | CASEme</title>

  <meta name="theme-color" content="#6c8875">
  <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="caseme-icons/favicon-32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="caseme-icons/apple-touch-icon.png">
  <link rel="manifest" href="site.webmanifest">

  <link rel="stylesheet" href="style.css?v=3">
</head>

<body class="auth-page">
  <header class="site-header">
    <div class="header-inner">
      <a
        href="index.html"
        class="logo"
        aria-label="CASEme ホーム"
      >
        CASE<span>me</span>
      </a>

      <nav class="header-nav" aria-label="メインメニュー">
        <a href="index.html">ホーム</a>
      </nav>
    </div>
  </header>

  <main class="auth-main">
    <section class="auth-card">
      <div class="auth-heading">
        <p class="section-label">WELCOME TO CASEME</p>

        <h1>今日の自分に、<br>
            今日のケースを。</h1>

        <p>
          ログインすると、スマホケースの投稿・編集・削除ができます。
        </p>
      </div>

      <!-- ログインと新規登録の切り替え -->
      <div class="auth-tabs" role="tablist">
        <button
          type="button"
          id="login-tab"
          class="auth-tab active"
          role="tab"
          aria-selected="true"
          aria-controls="login-form"
        >
          ログイン
        </button>

        <button
          type="button"
          id="signup-tab"
          class="auth-tab"
          role="tab"
          aria-selected="false"
          aria-controls="signup-form"
        >
          新規登録
        </button>
      </div>

      <!-- ログインフォーム -->
      <form id="login-form" class="auth-form">
        <div class="form-group">
          <label for="login-email">
            メールアドレス
          </label>

          <input
            type="email"
            id="login-email"
            autocomplete="email"
            placeholder="example@email.com"
            required
          >
        </div>

        <div class="form-group">
          <label for="login-password">
            パスワード
          </label>

          <div class="password-input-wrapper">
            <input
              type="password"
              id="login-password"
              autocomplete="current-password"
              minlength="8"
              required
            >
            <button type="button" class="password-toggle-button" id="toggle-login-password" aria-label="パスワードを表示する">
              <svg class="eye-on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
              <svg class="eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>
            </button>
          </div>
          <div style="text-align: right;">
            <button type="button" id="forgot-password-link" class="auth-link-sub">
              パスワードを忘れた場合
            </button>
          </div>
        </div>

        <button type="submit" class="auth-submit-button">
          ログイン
        </button>

        <p
          id="login-status"
          class="auth-status"
          aria-live="polite"
        ></p>
      </form>

      <!-- 新規登録フォーム -->
      <form
        id="signup-form"
        class="auth-form"
        hidden
      >
        <div class="form-group">
          <label for="signup-email">
            メールアドレス
          </label>

          <input
            type="email"
            id="signup-email"
            autocomplete="email"
            placeholder="example@email.com"
            required
          >
        </div>

        <div class="form-group">
          <label for="signup-password">
            パスワード
          </label>

          <div class="password-input-wrapper">
            <input
              type="password"
              id="signup-password"
              autocomplete="new-password"
              minlength="8"
              required
            >
            <button type="button" class="password-toggle-button" id="toggle-signup-password" aria-label="パスワードを表示する">
              <svg class="eye-on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
              <svg class="eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>
            </button>
          </div>

          <p class="input-note">
            8文字以上で設定してください。
          </p>
        </div>

        <div class="form-group">
          <label for="signup-password-confirmation">
            パスワードをもう一度入力
          </label>

          <div class="password-input-wrapper">
            <input
              type="password"
              id="signup-password-confirmation"
              autocomplete="new-password"
              minlength="8"
              required
            >
            <button type="button" class="password-toggle-button" id="toggle-signup-password-confirmation" aria-label="パスワードを表示する">
              <svg class="eye-on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
              <svg class="eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>
            </button>
          </div>
        </div>

        <button type="submit" class="auth-submit-button">
          アカウントを作成
        </button>

        <p class="auth-notice">
          登録したメールアドレスは公開されません。
        </p>

        <p
          id="signup-status"
          class="auth-status"
          aria-live="polite"
        ></p>
      </form>

      <!-- パスワード再設定メール送信フォーム -->
      <form
        id="reset-request-form"
        class="auth-form"
        hidden
      >
        <p class="auth-instruction">
          登録したメールアドレスを入力してください。<br>パスワード再設定用のメールをお送りします。
        </p>

        <div class="form-group">
          <label for="reset-email">
            メールアドレス
          </label>

          <input
            type="email"
            id="reset-email"
            placeholder="example@email.com"
            required
          >
        </div>

        <button type="submit" class="auth-submit-button">
          再設定メールを送信
        </button>

        <button
          type="button"
          id="back-to-login-button"
          class="auth-link-button"
        >
          ログインに戻る
        </button>

        <p
          id="reset-request-status"
          class="auth-status"
          aria-live="polite"
        ></p>
      </form>

      <!-- 新しいパスワード設定フォーム -->
      <form
        id="new-password-form"
        class="auth-form"
        hidden
      >
        <p class="auth-instruction">
          新しいパスワードを設定してください。
        </p>

        <div class="form-group">
          <label for="new-password">
            新しいパスワード
          </label>

          <div class="password-input-wrapper">
            <input
              type="password"
              id="new-password"
              minlength="8"
              required
            >
            <button type="button" class="password-toggle-button" id="toggle-new-password" aria-label="パスワードを表示する">
              <svg class="eye-on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
              <svg class="eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>
            </button>
          </div>
          <p class="input-note">
            8文字以上で設定してください。
          </p>
        </div>

        <div class="form-group">
          <label for="new-password-confirmation">
            新しいパスワードをもう一度入力
          </label>

          <div class="password-input-wrapper">
            <input
              type="password"
              id="new-password-confirmation"
              minlength="8"
              required
            >
            <button type="button" class="password-toggle-button" id="toggle-new-password-confirmation" aria-label="パスワードを表示する">
              <svg class="eye-on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
              <svg class="eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>
            </button>
          </div>
        </div>

        <button type="submit" class="auth-submit-button">
          パスワードを更新
        </button>

        <p
          id="new-password-status"
          class="auth-status"
          aria-live="polite"
        ></p>
      </form>

    </section>
  </main>

  <footer class="site-footer">
    <p>&copy; 2026 CASEme</p>
  </footer>

  <!-- Supabase公式JavaScriptライブラリ -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- CASEmeのSupabase接続設定 -->
  <script src="supabase-config.js"></script>

  <!-- ログイン・新規登録専用の処理 -->
  <script src="auth.js"></script>
</body>
</html>
